name: Build iOS (unsigned IPA)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: 4.6-stable
  IOS_PRESET: iOS                     # 你的 iOS 导出预设名称
  NAME: ${{ github.event.repository.name }}
  HOMEBREW_NO_AUTO_UPDATE: 1

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      # 1. 下载 Godot .NET 版本（带 Mono 支持）
      - name: Download Godot .NET (mono)
        run: |
          curl -L \
            "https://github.com/godotengine/godot-builds/releases/download/4.6.2-stable/Godot_v4.6.2-stable_mono_macos.universal.zip" \
            -o godot.zip
          unzip -q godot.zip -d godot
          # 将可执行文件移出嵌套目录以便调用
          mv godot/Godot_mono.app godot/Godot.app

      # 2. 安装 .NET SDK（macOS-14 自带，但确保可用）
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 3. 安装 iOS 导出模板（解压到模板目录）
      - name: Install iOS export template
        run: |
          TEMPLATES_DIR="$HOME/Library/Application Support/Godot/export_templates/4.6.stable"
          mkdir -p "$TEMPLATES_DIR"
          curl -L \
            "https://github.com/godotengine/godot-builds/releases/download/4.6.2-stable/Godot_v4.6.2-stable_export_templates.tpz" \
            -o /tmp/ios.zip
          # 解压模板（覆盖原有文件）
          unzip -o /tmp/ios.zip -d "$TEMPLATES_DIR"

      # 4. 编译 C# 解决方案（必须）
      - name: Build C# solutions
        run: |
          godot/Godot.app/Contents/MacOS/Godot --headless --path . --build-solutions

      # 5. 导出为 Xcode 项目
      - name: Export to Xcode project
        run: |
          mkdir -p build/ios
          godot/Godot.app/Contents/MacOS/Godot --headless --path . \
            --export-release "${IOS_PRESET}" build/ios/${NAME}.xcodeproj

      # 6. 使用 xcodebuild 构建未签名的 archive
      - name: xcodebuild archive (unsigned)
        run: |
          xcodebuild archive \
            -project build/ios/${NAME}.xcodeproj \
            -scheme "${NAME}" \
            -archivePath build/ios/App.xcarchive \
            -configuration Release \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      # 7. 打包 .app 为 .ipa
      - name: Package IPA
        run: |
          cd build/ios
          mkdir -p Payload
          cp -R App.xcarchive/Products/Applications/*.app Payload/
          zip -r "${NAME}.ipa" Payload
          mv "${NAME}.ipa" ../../

      # 8. 上传产物
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: ${{ env.NAME }}.ipa
          retention-days: 14