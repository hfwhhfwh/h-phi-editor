name: Build iOS (unsigned IPA)

# Run on every push to main + on demand (workflow_dispatch)
on:
  # push:
  #   branches: [main]
  workflow_dispatch:

env:
  # ----- project-specific knobs -----
  GODOT_VERSION: 4.6-stable # dont forget update export templates if bumping this version
  IOS_PRESET:    iOS          # export-preset name in Godot
  NAME:          ${{ github.event.repository.name }}
  # speed: stop brew from auto-updating every run
  HOMEBREW_NO_AUTO_UPDATE: 1

jobs:
  build-ios:
    runs-on: macos-14      # Apple Silicon runner w/ Xcode 16
    timeout-minutes: 30

    steps:
    # 0. Pull repo
    - name: Checkout
      uses: actions/checkout@v4
      with:
        lfs: true 

    # 1. Get headless Godot
    - name: Download Godot headless
      run: |
        curl -L \
          "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_mono_macos.universal.zip" \
          -o godot.zip
        unzip -q godot.zip -d godot
        ls -la godot/  # 看看实际解压出来叫什么
        
    # 2. Copy iOS export template from repo folder
    #    TODO: To save some bandwidth, I decided to store export template in the repository. (180 MB vs over 1 GB)
    #    The ios.zip template must be stored in folder called export_templates/{godot-version}/
    #    The godot version uses a dash in the name but export template uses a dot.
    #    E.g.: /export_templates/4.4.1.stable/ios.zip
    - name: Install iOS export template
      run: |
        templates_root="$HOME/Library/Application Support/Godot/export_templates"
        mkdir -p "$templates_root"
        cp -R "export_templates/." "$templates_root/"

    # 2.5 安装 .NET SDK（iOS C# 需要 .NET 8+）
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # 2.6 构建 C# 项目（必须先编译通过，Godot 才能识别 autoload）
    - name: Build C# project
      run: |
        dotnet build
        # 或者如果项目文件不在根目录：
        # dotnet build HPhiEditor.csproj

    # 3. Export preset -> Xcode project
    #    TODO: In addition to other mandatory fields (try running the export locally first),
    #    you need to enable `application/export_project_only=true` and `application/delete_old_export_files_unconditionally=true`.
    #    You can find these options in Advanced Options.
    - name: Export to Xcode project
      run: |
        mkdir -p build/ios
        godot/Godot_mono.app/Contents/MacOS/Godot --headless --path . \
          --export-release "${IOS_PRESET}" build/ios/${NAME}.xcodeproj

    # ===== 修复 Godot 4.6 iOS 项目 =====
    - name: Fix iOS project for Swift runtime
      run: |
        # 1. 创建 xcconfig 文件覆盖 build settings
        cat > build/ios/FixSwift.xcconfig << 'EOCC'
        IPHONEOS_DEPLOYMENT_TARGET = 15.0
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES = YES
        SWIFT_VERSION = 5.0
        CLANG_ENABLE_MODULES = YES
        SWIFT_OBJC_INTERFACE_HEADER_NAME = $(SWIFT_MODULE_NAME)-Swift.h
        LD_RUNPATH_SEARCH_PATHS = $(inherited) @executable_path/Frameworks /usr/lib/swift
        LIBRARY_SEARCH_PATHS = $(SDKROOT)/usr/lib/swift $(TOOLCHAIN_DIR)/usr/lib/swift/$(PLATFORM_NAME) $(inherited)
        OTHER_LDFLAGS = $(inherited) -ld_classic
        ENABLE_BITCODE = NO
        EOCC

        # 2. 检查 Godot 导出模板是否自带 dummy.swift
        if [ -f "build/ios/${NAME}/dummy.swift" ]; then
          echo "Found Godot's dummy.swift"
        else
          echo "Godot dummy.swift missing, creating one"
          echo 'import Foundation' > "build/ios/${NAME}/dummy.swift"
        fi
        
        # 3. 确保 dummy.swift 在编译源中（用 xcodebuild 验证）
        xcodebuild -project build/ios/${NAME}.xcodeproj \
          -target "${NAME}" \
          -showBuildSettings | grep -i swift || true

    # 4. Build unsigned archive
    - name: xcodebuild archive (unsigned)
      run: |
        set -o pipefail
        
        xcodebuild archive \
          -project build/ios/${NAME}.xcodeproj \
          -scheme "${NAME}" \
          -sdk iphoneos \
          -destination 'generic/platform=iOS' \
          -archivePath build/ios/App.xcarchive \
          -configuration Release \
          -xcconfig build/ios/FixSwift.xcconfig \
          CODE_SIGN_STYLE=Manual \
          CODE_SIGN_IDENTITY="" \
          PROVISIONING_PROFILE_SPECIFIER="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          ARCHS=arm64 \
          | xcpretty

    - name: Verify archive exists
      run: ls -R build/ios/

    # 5. Package .ipa
    - name: Package IPA
      run: |
        cd build/ios
        mkdir -p Payload
        cp -R App.xcarchive/Products/Applications/*.app Payload/
        zip -r "${NAME}.ipa" Payload
        mv "${NAME}.ipa" ../../

    # 6. Publish artifact
    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: unsigned-ipa
        path: ${{ env.NAME }}.ipa
        retention-days: 14
        
    # TODO: Now you can download the build from the pipeline and use a sideload store to 
    #    load it to your iPhone/iPad. You can use AltStore classic, for example.
    #    You can follow the guide for VCMI - https://vcmi.eu/players/Installation_iOS/