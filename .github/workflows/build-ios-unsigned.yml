name: Build iOS (unsigned IPA)

# Run on every push to main + on demand (workflow_dispatch)
on:
  # push:
  #   branches: [main]
  workflow_dispatch:

env:
  # ----- project-specific knobs -----
  GODOT_VERSION: 4.6-stable # dont forget update export templates if bumping this version
  IOS_PRESET:    iOS          # export-preset name in Godot
  NAME:          ${{ github.event.repository.name }}
  # speed: stop brew from auto-updating every run
  HOMEBREW_NO_AUTO_UPDATE: 1

jobs:
  build-ios:
    runs-on: macos-14      # Apple Silicon runner w/ Xcode 16
    timeout-minutes: 30

    steps:
    # 0. Pull repo
    - name: Checkout
      uses: actions/checkout@v4
      with:
        lfs: true 

    # 1. Get headless Godot
    - name: Download Godot headless
      run: |
        curl -L \
          "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_mono_macos.universal.zip" \
          -o godot.zip
        unzip -q godot.zip -d godot
        ls -la godot/  # 看看实际解压出来叫什么
        
    # 2. Copy iOS export template from repo folder
    #    TODO: To save some bandwidth, I decided to store export template in the repository. (180 MB vs over 1 GB)
    #    The ios.zip template must be stored in folder called export_templates/{godot-version}/
    #    The godot version uses a dash in the name but export template uses a dot.
    #    E.g.: /export_templates/4.4.1.stable/ios.zip
    - name: Install iOS export template
      run: |
        templates_root="$HOME/Library/Application Support/Godot/export_templates"
        mkdir -p "$templates_root"
        cp -R "export_templates/." "$templates_root/"

    # 2.5 安装 .NET SDK（iOS C# 需要 .NET 8+）
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # 2.6 构建 C# 项目（必须先编译通过，Godot 才能识别 autoload）
    - name: Build C# project
      run: |
        dotnet build
        # 或者如果项目文件不在根目录：
        # dotnet build HPhiEditor.csproj

    # 3. Export preset -> Xcode project
    - name: Export to Xcode project
      run: |
        mkdir -p build/ios
        godot/Godot_mono.app/Contents/MacOS/Godot --headless --path . \
          --export-release "${IOS_PRESET}" build/ios/${NAME}.xcodeproj

    # ===== 修复 Godot 4.6 iOS 项目 Swift 链接问题 =====
    - name: Fix iOS project for Swift runtime linking
      run: |
        python3 << 'EOF'
        import os, re, uuid, shutil

        name = os.environ['NAME']
        proj_dir = f"build/ios/{name}.xcodeproj"
        pbx = f"{proj_dir}/project.pbxproj"

        with open(pbx, 'r') as f:
            c = f.read()

        # 1. 提升部署目标到 iOS 15.0
        c = c.replace('IPHONEOS_DEPLOYMENT_TARGET = 11.0;', 'IPHONEOS_DEPLOYMENT_TARGET = 15.0;')
        c = c.replace('IPHONEOS_DEPLOYMENT_TARGET = 12.0;', 'IPHONEOS_DEPLOYMENT_TARGET = 15.0;')
        c = c.replace('IPHONEOS_DEPLOYMENT_TARGET = 14.0;', 'IPHONEOS_DEPLOYMENT_TARGET = 15.0;')

        # 2. 强制嵌入 Swift 标准库
        if 'ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES = NO' in c:
            c = c.replace('ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES = NO;', 'ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES = YES;')
        elif 'ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES' not in c:
            c = re.sub(r'(buildSettings = \{\n)', r'\1\t\t\t\tALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES = YES;\n', c)

        # 3. 添加 Swift 库搜索路径
        if 'LIBRARY_SEARCH_PATHS' not in c:
            c = re.sub(r'(buildSettings = \{\n)', r'\1\t\t\t\tLIBRARY_SEARCH_PATHS = "$(SDKROOT)/usr/lib/swift $(TOOLCHAIN_DIR)/usr/lib/swift/$(PLATFORM_NAME) $(inherited)";\n', c)

        # 4. 添加 Runpath Search Paths
        if 'LD_RUNPATH_SEARCH_PATHS' not in c:
            c = re.sub(r'(buildSettings = \{\n)', r'\1\t\t\t\tLD_RUNPATH_SEARCH_PATHS = "$(inherited) @executable_path/Frameworks /usr/lib/swift";\n', c)

        # 5. 添加 SWIFT_VERSION
        if 'SWIFT_VERSION' not in c:
            c = re.sub(r'(buildSettings = \{\n)', r'\1\t\t\t\tSWIFT_VERSION = 5.0;\n', c)

        # 6. 创建 DummySwift.swift（放在与 xcodeproj 同级的 build/ios/ 目录）
        swift_path = f"build/ios/DummySwift.swift"
        with open(swift_path, 'w') as f:
            f.write('import Foundation\n')

        # 7. 将 DummySwift.swift 添加到 project.pbxproj
        fid = uuid.uuid4().hex[:24].upper()
        bid = uuid.uuid4().hex[:24].upper()

        # PBXBuildFile
        bf = f'\t\t{bid} /* DummySwift.swift in Sources */ = {{isa = PBXBuildFile; fileRef = {fid} /* DummySwift.swift */; }};\n'
        c = c.replace('/* Begin PBXBuildFile section */', f'/* Begin PBXBuildFile section */\n{bf}')

        # PBXFileReference
        fr = f'\t\t{fid} /* DummySwift.swift */ = {{isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = DummySwift.swift; sourceTree = "<group>"; }};\n'
        c = c.replace('/* Begin PBXFileReference section */', f'/* Begin PBXFileReference section */\n{fr}')

        # 添加到主 group 的 children（第一个 children = (）
        c = re.sub(r'(children = \(\n)', rf'\1\t\t\t\t{fid} /* DummySwift.swift */,\n', c, count=1)

        # 添加到 PBXSourcesBuildPhase 的 files
        c = re.sub(
            r'(isa = PBXSourcesBuildPhase;.*?files = \(\n)',
            rf'\1\t\t\t\t\t\t{bid} /* DummySwift.swift in Sources */,\n',
            c,
            count=1,
            flags=re.DOTALL
        )

        with open(pbx, 'w') as f:
            f.write(c)

        print("=== 验证修复 ===")
        for kw in ['OTHER_LDFLAGS', 'IPHONEOS_DEPLOYMENT_TARGET', 'ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES', 'SWIFT_VERSION', 'LIBRARY_SEARCH_PATHS']:
            found = False
            for i, line in enumerate(c.split('\n')):
                if kw in line:
                    print(f"{i+1}: {line.strip()}")
                    found = True
                    break
            if not found:
                print(f"{kw}: NOT FOUND")
        print(f"DummySwift.swift: {os.path.exists(swift_path)}")
        EOF

    # 4. Build unsigned archive
    - name: xcodebuild archive (unsigned)
      run: |
        set -o pipefail
        
        xcodebuild archive \
          -project build/ios/${NAME}.xcodeproj \
          -scheme "${NAME}" \
          -sdk iphoneos \
          -destination 'generic/platform=iOS' \
          -archivePath build/ios/App.xcarchive \
          -configuration Release \
          CODE_SIGN_STYLE=Manual \
          CODE_SIGN_IDENTITY="" \
          PROVISIONING_PROFILE_SPECIFIER="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          ARCHS=arm64 \
          SWIFT_VERSION=5.0 \
          IPHONEOS_DEPLOYMENT_TARGET=15.0 \
          ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES=YES \
          OTHER_LDFLAGS="-ld_classic" \
          | xcpretty

    - name: Verify archive exists
      run: ls -R build/ios/

    # 5. Package .ipa
    - name: Package IPA
      run: |
        cd build/ios
        mkdir -p Payload
        cp -R App.xcarchive/Products/Applications/*.app Payload/
        zip -r "${NAME}.ipa" Payload
        mv "${NAME}.ipa" ../../

    # 6. Publish artifact
    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: unsigned-ipa
        path: ${{ env.NAME }}.ipa
        retention-days: 14
        
    # TODO: Now you can download the build from the pipeline and use a sideload store to 
    #    load it to your iPhone/iPad. You can use AltStore classic, for example.
    #    You can follow the guide for VCMI - https://vcmi.eu/players/Installation_iOS/