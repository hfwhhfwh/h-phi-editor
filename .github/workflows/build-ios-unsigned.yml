name: Build iOS (unsigned IPA)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # 统一使用具体版本号（4.6.2），避免混用 4.6-stable 和 4.6.2
  GODOT_VERSION: 4.6.2-stable
  IOS_PRESET: iOS                     # 请与项目中的导出预设名称完全一致
  NAME: ${{ github.event.repository.name }}
  HOMEBREW_NO_AUTO_UPDATE: 1

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      # 1. 下载 Godot .NET（带 Mono）
      - name: Download Godot .NET
        run: |
          curl -L \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_mono_macos.universal.zip" \
            -o godot.zip
          unzip -q godot.zip -d godot
          mv godot/Godot_mono.app godot/Godot.app

      # 2. 安装 .NET SDK（确保版本一致）
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 3. 安装 iOS 导出模板（直接下载 ios.zip，不要用 .tpz）
      - name: Install iOS export template
        run: |
          TEMPLATES_DIR="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}"
          mkdir -p "$TEMPLATES_DIR"
          curl -L \
            "https://github.com/godotengine/godot-builds/releases/download/4.6.2-stable/Godot_v4.6.2-stable_export_templates.tpz" \
            -o "$TEMPLATES_DIR/ios.zip"
          # Godot 4 会自动识别该 zip，无需手动解压

      # 4. 清理 .godot 缓存（解决 UID 冲突和残留编译缓存）
      - name: Clean .godot directory
        run: rm -rf .godot

      # 5. 直接构建项目文件（跳过 .sln 的配置歧义）
      - name: Build C# project
        run: |
          dotnet build HPhiEditor.csproj --configuration Release --no-restore --verbosity normal

      # 6. 让 Godot 加载并注册脚本（可省略，但保留确保状态）
      - name: Sync scripts with Godot
        run: |
          godot/Godot.app/Contents/MacOS/Godot --headless --path . --build-solutions --quit

      # 7. 导出为 Xcode 项目
      - name: Export to Xcode project
        run: |
          mkdir -p build/ios
          godot/Godot.app/Contents/MacOS/Godot --headless --path . \
            --export-release "${IOS_PRESET}" build/ios/${NAME}.xcodeproj

      # 8. 使用 xcodebuild 构建未签名的 archive
      - name: xcodebuild archive (unsigned)
        run: |
          xcodebuild archive \
            -project build/ios/${NAME}.xcodeproj \
            -scheme "${NAME}" \
            -archivePath build/ios/App.xcarchive \
            -configuration Release \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      # 9. 打包 .app 为 .ipa
      - name: Package IPA
        run: |
          cd build/ios
          mkdir -p Payload
          cp -R App.xcarchive/Products/Applications/*.app Payload/
          zip -r "${NAME}.ipa" Payload
          mv "${NAME}.ipa" ../../

      # 10. 上传产物
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: ${{ env.NAME }}.ipa
          retention-days: 14