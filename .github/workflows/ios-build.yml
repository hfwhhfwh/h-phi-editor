name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. 下载 Godot 4.6 编辑器及导出模板
      - name: Download Godot and export templates
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.6-stable/Godot_v4.6-stable_macos.universal.zip
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz
          unzip -q Godot_v4.6-stable_macos.universal.zip
          unzip -q Godot_v4.6-stable_export_templates.tpz
          mkdir -p ~/Library/Application\ Support/Godot/export_templates/4.6.stable
          mv templates/* ~/Library/Application\ Support/Godot/export_templates/4.6.stable

      # 2. 检查 .NET SDK 版本（Godot 4.6 需要 .NET 8）
      - name: Check .NET SDK
        run: dotnet --info

      # 3. 清理所有可能的缓存（彻底）
      - name: Clean caches
        run: |
          rm -rf .godot
          rm -rf obj
          rm -rf bin
          find . -name "*.csproj.user" -delete

      # 4. 手动还原和编译 C# 项目（关键！）
      - name: Restore NuGet packages
        run: dotnet restore

      - name: Build C# project
        run: dotnet build --configuration Debug

      # 1. 先用 Godot 生成 Mono 项目（这一步会生成 .godot/mono 和必要的元数据）
      - name: Generate Mono project with Godot
        run: ./Godot.app/Contents/MacOS/Godot --headless --path . --build-solutions --quit || true

      # 2. 然后再导入资源（此时脚本类已注册，场景能正确加载）
      - name: Import assets
        run: ./Godot.app/Contents/MacOS/Godot --headless --path . -e --quit || true

      # 3. 创建导出目录（防止目录不存在）
      - name: Create export directory
        run: mkdir -p build/ios

      # 4. 导出 iOS（现在应该成功）
      - name: Export iOS
        run: ./Godot.app/Contents/MacOS/Godot --headless --path . --export-release iOS

      # 7. 导出 iOS 项目（如果预设名不是 "iOS"，请修改）
      - name: Export iOS project
        run: ./Godot.app/Contents/MacOS/Godot --headless --path . --export-release iOS

      # 8. 上传 IPA
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MyGame-ipa
          path: ./build/ios/*.ipa   # 请根据你的 export_presets.cfg 调整
          retention-days: 7