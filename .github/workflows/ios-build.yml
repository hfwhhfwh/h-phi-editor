name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. 下载 Godot 4.6 及导出模板
      - name: Download Godot and export templates
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.6-stable/Godot_v4.6-stable_macos.universal.zip
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz
          unzip -q Godot_v4.6-stable_macos.universal.zip
          unzip -q Godot_v4.6-stable_export_templates.tpz
          mkdir -p ~/Library/Application\ Support/Godot/export_templates/4.6.stable
          mv templates/* ~/Library/Application\ Support/Godot/export_templates/4.6.stable

      # 2. 确保 .NET SDK 可用（macOS runner 默认有，但显式检查一下）
      - name: Check .NET SDK
        run: dotnet --info

      # 3. 删除可能过期的 .godot 缓存（避免 UID 冲突）
      - name: Clean .godot cache
        run: rm -rf .godot

      # 4. 还原 NuGet 包（可选，但推荐）
      - name: Restore NuGet packages
        run: dotnet restore

      # 5. 编译 C# 代码（Godot 的 --build-solutions 会同时还原和编译）
      - name: Build C# solutions
        run: ./Godot.app/Contents/MacOS/Godot --headless --path . --build-solutions

      # 6. 导入所有资产（并自动退出）
      - name: Import assets
        run: ./Godot.app/Contents/MacOS/Godot --headless --path . -e --quit

      # 7. 导出 iOS 项目
      - name: Export iOS project
        run: ./Godot.app/Contents/MacOS/Godot --headless --path . --export-release iOS

      # 8. 上传 IPA（路径请根据你的 export_presets.cfg 调整）
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MyGame-ipa
          path: ./build/ios/*.ipa
          retention-days: 7