name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. 下载 Godot 4.6 编辑器及导出模板
      - name: Download Godot and export templates
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.6-stable/Godot_v4.6-stable_macos.universal.zip
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.6-stable/Godot_v4.6-stable_export_templates.tpz
          unzip -q Godot_v4.6-stable_macos.universal.zip
          unzip -q Godot_v4.6-stable_export_templates.tpz
          mkdir -p ~/Library/Application\ Support/Godot/export_templates/4.6.stable
          mv templates/* ~/Library/Application\ Support/Godot/export_templates/4.6.stable

      # 2. 检查 .NET SDK 版本（Godot 4.6 需要 .NET 8）
      - name: Check .NET SDK
        run: dotnet --info

      # 3. 清理所有可能的缓存（彻底）
      - name: Clean caches
        run: |
          rm -rf .godot
          rm -rf obj
          rm -rf bin
          find . -name "*.csproj.user" -delete

      # 4. 手动还原和编译 C# 项目（关键！）
      - name: Restore NuGet packages
        run: dotnet restore

      - name: Build C# project
        run: dotnet build --configuration Release

      # 5. 让 Godot 导入所有资源并强制退出（此时脚本已编译，场景可加载）
      - name: Import assets
        run: |
          ./Godot.app/Contents/MacOS/Godot --headless --path . -e --quit || true
          # 即使有错误也继续，因为 Godot 可能返回非零但已完成导入

      # 6. 再次触发 Godot 的 C# 编译（确保绑定生成）
      - name: Build solutions with Godot
        run: |
          ./Godot.app/Contents/MacOS/Godot --headless --path . --build-solutions --quit || true

      # 7. 导出 iOS 项目（如果预设名不是 "iOS"，请修改）
      - name: Export iOS project
        run: ./Godot.app/Contents/MacOS/Godot --headless --path . --export-release iOS

      # 8. 上传 IPA
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MyGame-ipa
          path: ./build/ios/*.ipa   # 请根据你的 export_presets.cfg 调整
          retention-days: 7