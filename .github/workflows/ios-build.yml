name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # 允许手动触发

jobs:
  export_ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Export iOS project using Godot 4.6
        uses: dulvui/godot4-ios-export@v1
        with:
          godot-version: 4.6
          godot-channel: stable   # 可以是 beta, rc1 等
          working-directory: .    # 你的项目根目录

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyGame-ipa
          path: ./build/ios/*.ipa   # 根据实际导出路径调整
          retention-days: 7